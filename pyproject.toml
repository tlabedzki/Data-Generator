[project]
name = "data-generator"
version = "1.7.1"
description = "Synthetic data for a fictional Polish online shop: 15 linked tables with answers to check"
requires-python = ">=3.11"
license = "MIT"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".local", "export"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["func", "settings", "ui", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
